[project]
name = "alphamemo"
version = "0.1.0"
description = "AlphaMemo: search-process memory for self-evolving alpha mining."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pyyaml>=6.0",
]

[project.scripts]
alphamemo = "sspm.cli:main"
sspm = "sspm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sspm*"]
